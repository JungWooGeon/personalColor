<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새로운 나의 컬러는? 앱이 나왔어요</title>
<meta name="description" content="새로워진 나의 컬러는? 앱으로 업데이트해 주세요.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF8F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main class="update aurora">
  <div>
    <img class="bob" src="/assets/tinty/cheer.svg" alt="반가워하는 캐릭터 틴티" width="148" height="148">
    <h1>새로운 나의 컬러는?<br>앱이 나왔어요</h1>
    <ul>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>사진 한 장으로 12톤 AI 진단</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.1-1.8-.6-1-.1-2.2 1.1-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>12톤 컬러 도감과 오늘의 코디</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>사진은 기기 밖으로 나가지 않아요</li>
    </ul>
    <a class="btn btn-primary btn-block" id="update" href="https://play.google.com/store/apps/details?id=com.gun.personalcolor">앱 업데이트하기</a>
    <p class="note">버튼이 안 되면 Play 스토어에서<br>‘나의 컬러는?’을 검색해 업데이트해 주세요.</p>
  </div>
</main>
<script>
  // Android browsers: try the Play app, fall back to the web page after 600ms.
  // Old app WebView ("; wv)") routes every URL through loadUrl, so market:// would only show an error page there — keep the https link.
  var ua = navigator.userAgent;
  if (/Android/i.test(ua) && !/; wv\)/.test(ua)) {
    document.getElementById("update").addEventListener("click", function (e) {
      e.preventDefault();
      var web = this.href;
      location.href = "market://details?id=com.gun.personalcolor";
      setTimeout(function () { if (!document.hidden) location.href = web; }, 600);
    });
  }
</script>
</body>
</html>
